<!-- app/templates/_partials/whois_button.html -->
<span id="whois-btn-wrap">
  {% if loading %}
    <button class="btn" disabled>
      <span class="spin" style="display:inline-block; width:16px; height:16px; border:2px solid currentColor; border-right-color: transparent; border-radius:50%; margin-right:6px; vertical-align:-2px; animation:spin 0.8s linear infinite;"></span>
      Scanning…
    </button>
    <script>
      // poll table; când apare, înlocuiește butonul înapoi
      (function poll(){
        fetch("/variants/{{ variant.id }}/whois/table", {headers: {"HX-Request":"true"}})
          .then(r => r.text())
          .then(html => {
            if (html && html.trim().length > 0) {
              // injectăm/actualizăm tabelul
              const wrap = document.getElementById("whois-wrap");
              if (wrap) { wrap.innerHTML = html; }
              // readucem butonul „Scan WHOIS”
              fetch("/variants/{{ variant.id }}/whois/button", {headers: {"HX-Request":"true"}})
                .then(r => r.text())
                .then(b => { const w = document.getElementById("whois-btn-wrap"); if (w) w.outerHTML = b; });
            } else {
              setTimeout(poll, 1200);
            }
          }).catch(() => setTimeout(poll, 1500));
      })();
    </script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  {% else %}
    <button
      class="btn btn-primary"
      hx-post="/variants/{{ variant.id }}/whois/trigger"
      hx-target="#whois-btn-wrap"
      hx-swap="outerHTML">
      Scan WHOIS
    </button>
  {% endif %}
</span>
